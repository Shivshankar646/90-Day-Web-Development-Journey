<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
</head>
<body>
    <form>
        <label for="full-name">Enter your name</label>
        <input type="text" id="full-name" placeholder="Enter your name" required>
        <label for="email">Enter your email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <label for="password">Enter your password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      <label for="city">Choose your city</label>
      <select name="city" id="city" required>
        <option value="mahur">Mahur</option>
        <option value="nanded">Nanded</option>
        <option value="hyderabad">Hyderabad</option>
        <option value="pune">Pune</option>
      </select>
      <label>contact me here</label>
      <label for="phone">Phone</label>
      <input type="radio" id="phone" name="contact" value="phone" required>
      <label for="email1">Email</label>
      <input type="radio" id="email1" name="contact" value="email">
      <label for="whatsapp">whatsapp</label>
      <input type="radio" id="whatsapp" name="contact" value="whatsapp">

      <label >select skills</label>
      <label for="html">Html</label>
      <input type="checkbox" id="html" name="skills" value="html">
      <label for="css">Css</label>
      <input type="checkbox" id="css" name="skills" value="css">
      <label for="javascript">javascript</label>
      <input type="checkbox" id="javascript" name="skills" value="javascript">
      <label for="react">React</label>
      <input type="checkbox" id="react" name="skills" value="react">
      <label for="message">Enter your message</label>
      <textarea name="message" id="message" required></textarea>
      <button>Registration</button>
    </form>
    <form>
        <label for="phone-number">Enter your phone no.</label>
        <input type="number" id="phone-number" required>
        <label>rooms type select</label>
        <label for="standard">standard</label>
        <input type="radio" id="stabdard" value="stabdard" name="room">
        <label for="delux">delux</label>
        <input type="radio" id="delux" value="delux" name="room">
        <label for="suite">suite</label>
        <input type="radio" id="suite" value="suite" name="room">
<label for="guest">Number of Guest</label>
<select name="num-guest" id="guest" required>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
</select>
    </form>
</body>
</html>
